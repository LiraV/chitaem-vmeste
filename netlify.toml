[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback. Functions are matched first (they declare `path` in-file),
# so /api/claude is not swallowed by this rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
